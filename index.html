<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaLite - Painel Climático Urbano</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-card { background: #ffffff; width: 100%; max-width: 420px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #e1e8ed; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.5rem; color: #1e293b; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .badge { background: #e0f2fe; color: #0369a1; font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; }
        .search-box button { background: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .search-box button:hover { background: #1d4ed8; }
        .weather-info { text-align: center; display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .temp-display { font-size: 3rem; font-weight: 700; color: #0f172a; margin: 10px 0; }
        .city-title { font-size: 1.25rem; font-weight: 600; color: #334155; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .detail-item { background: #f8fafc; padding: 10px; border-radius: 8px; text-align: center; }
        .detail-item span { display: block; font-size: 0.75rem; color: #64748b; }
        .detail-item strong { font-size: 1rem; color: #1e293b; }
        .fav-status { margin-top: 15px; font-size: 0.8rem; color: #16a34a; background: #f0fdf4; padding: 6px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ClimaLite <span class="badge">Sem Anúncios</span></h1>
        <p style="font-size:0.85rem; color:#64748b; margin-top:4px;">Painel de Consulta Climática - Polo UNIVESP SJC</p>
    </div>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Digite a cidade (ex: São José dos Campos)">
        <button onclick="buscarClima()">Buscar</button>
    </div>

    <div id="weatherContent" class="weather-info">
        <div class="city-title" id="cityName">--</div>
        <div class="temp-display" id="tempValue">--°C</div>
        
        <div class="details-grid">
            <div class="detail-item">
                <span>Vento</span>
                <strong id="windValue">-- km/h</strong>
            </div>
            <div class="detail-item">
                <span>Umidade Relativa</span>
                <strong id="humidityValue">-- %</strong>
            </div>
        </div>

        <div class="fav-status">
            ✓ Cidade salva no <strong>localStorage</strong> do navegador
        </div>
    </div>
</div>

<script>
    // Carregar última cidade favoritada ao abrir a página
    window.onload = function() {
        const salva = localStorage.getItem('climalite_cidade');
        if (salva) {
            document.getElementById('cityInput').value = salva;
            buscarClima();
        } else {
            document.getElementById('cityInput').value = 'São José dos Campos';
            buscarClima();
        }
    };

    async function buscarClima() {
        const cidade = document.getElementById('cityInput').value.trim();
        if (!cidade) return alert('Por favor, digite uma cidade.');

        try {
            // Geocodificação Open-Meteo
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`);
            const geoData = await geoRes.json();

            if (!geoData.results || geoData.results.length === 0) {
                alert('Cidade não encontrada.');
                return;
            }

            const { latitude, longitude, name, admin1 } = geoData.results[0];

            // Busca do clima via Open-Meteo REST API
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=relativehumidity_2m`);
            const weatherData = await weatherRes.json();

            // Atualização da Interface (DOM)
            document.getElementById('cityName').innerText = `${name} - ${admin1 || ''}`;
            document.getElementById('tempValue').innerText = `${Math.round(weatherData.current_weather.temperature)}°C`;
            document.getElementById('windValue').innerText = `${weatherData.current_weather.windspeed} km/h`;
            document.getElementById('humidityValue').innerText = `${weatherData.hourly.relativehumidity_2m[0]}%`;

            // Exibir card
            document.getElementById('weatherContent').style.display = 'block';

            // Salvar no localStorage (requisito de persistência leve no cliente)
            localStorage.setItem('climalite_cidade', cidade);

        } catch (error) {
            console.error(error);
            alert('Erro ao conectar com a API Open-Meteo.');
        }
    }
</script>

</body>
</html>
