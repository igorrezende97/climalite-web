<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClimaLite - Painel Climático</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --accent-color: #2563eb;
      --border-color: #e5e7eb;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-color: #ffffff;
      --accent-color: #ffff00;
      --border-color: #ffffff;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .btn-contrast {
      background-color: var(--text-color);
      color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"], textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    button.primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    body.high-contrast button.primary {
      color: #000000;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .info-item {
      background-color: rgba(0,0,0,0.03);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    body.high-contrast .info-item {
      border: 1px solid #fff;
    }

    .status-msg {
      background-color: #d1fae5;
      color: #065f46;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85em;
      margin-top: 15px;
      text-align: center;
    }

    body.high-contrast .status-msg {
      background-color: #000;
      color: #00ff00;
      border: 1px solid #00ff00;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-contrast" onclick="toggleContrast()" aria-label="Alternar alto contraste">🌓 Alto Contraste</button>
  </div>

  <div class="card">
    <h2 style="text-align: center; margin-top: 0;">ClimaLite</h2>
    <p style="text-align: center; font-size: 0.9em; opacity: 0.8;">Painel de Consulta Climática - Polo UNIVESP SJC</p>

    <div class="search-box">
      <input type="text" id="cityInput" value="São José dos Campos" placeholder="Digite a cidade...">
      <button class="primary" onclick="buscarClima()">Buscar</button>
    </div>

    <div id="resultado" style="text-align: center;">
      <h3 id="cidadeNome">São José dos Campos - São Paulo</h3>
      <h1 id="tempVal" style="font-size: 3em; margin: 10px 0;">22°C</h1>

      <div class="info-grid">
        <div class="info-item">
          <small>Vento</small><br>
          <strong id="ventoVal">4.3 km/h</strong>
        </div>
        <div class="info-item">
          <small>Umidade Relativa</small><br>
          <strong id="umidadeVal">91%</strong>
        </div>
      </div>
    </div>

    <div class="status-msg">
      ✓ Cidade salva no <strong>localStorage</strong> do navegador
    </div>
  </div>

  <!-- Bloco de Feedback do Usuário (Para validação do PI) -->
  <div class="card">
    <h3>Feedback do Frequentador do Polo</h3>
    <p style="font-size: 0.85em; opacity: 0.8;">Deixe seu comentário sobre a velocidade e facilidade de uso do ClimaLite:</p>
    <textarea id="feedbackText" rows="3" placeholder="O site carregou rápido? As informações estão claras?"></textarea>
    <button class="primary" style="margin-top: 10px; width: 100%;" onclick="enviarFeedback()">Enviar Feedback</button>
    <div id="feedbackStatus" style="margin-top: 10px; font-size: 0.85em; text-align: center;"></div>
  </div>

  <!-- Widget do VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    function toggleContrast() {
      document.body.classList.toggle('high-contrast');
    }

    async function enviarFeedback() {
      const txt = document.getElementById('feedbackText').value;
      const status = document.getElementById('feedbackStatus');
      
      if (txt.trim() === '') {
        status.style.color = 'red';
        status.innerText = 'Por favor, escreva uma mensagem antes de enviar.';
        return;
      }

      try {
        const response = await fetch('http://127.0.0.1:8000/api/feedback', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ mensagem: txt })
        });

        if (response.ok) {
          status.style.color = 'green';
          status.innerText = '✓ Feedback guardado com sucesso na base de dados SQLite!';
          document.getElementById('feedbackText').value = '';
        } else {
          status.style.color = 'red';
          status.innerText = 'Erro ao comunicar com a API.';
        }
      } catch (err) {
        status.style.color = 'red';
        status.innerText = 'Erro de ligação. O servidor FastAPI está a correr?';
      }
    }

    // Carregar preferências salvas se existirem
    window.onload = function() {
      const savedCity = localStorage.getItem('climalite_city');
      if (savedCity) {
        document.getElementById('cityInput').value = savedCity;
        document.getElementById('cidadeNome').innerText = savedCity;
      }
    };

    function buscarClima() {
      const city = document.getElementById('cityInput').value;
      localStorage.setItem('climalite_city', city);
      document.getElementById('cidadeNome').innerText = city;
    }
  </script>
</body>
</html>
